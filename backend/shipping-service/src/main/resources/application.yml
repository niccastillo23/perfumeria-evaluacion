server:
  port: 8086

spring:
  application:
    name: shipping-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/perfumeria}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driverClassName: org.postgresql.Driver
    hikari:
      data-source-properties:
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: shipping_schema
    open-in-view: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:perfumeria}
    password: ${RABBITMQ_PASSWORD:change-me-local}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        prefetch: 10

app:
  messaging:
    exchanges:
      shipping: perfumeria.shipping.direct
      dead-letter: perfumeria.dead-letter.direct
    routing-keys:
      shipping-requested: shipping.requested
      shipping-dead: shipping.requests.dead
    queues:
      shipping-requests: perfumeria.shipping.requests
      shipping-requests-dlq: perfumeria.shipping.requests.dlq
    consumer:
      max-attempts: ${RABBITMQ_CONSUMER_MAX_ATTEMPTS:3}
      retry-delay-ms: ${RABBITMQ_CONSUMER_RETRY_DELAY_MS:250}

resilience4j:
  circuitbreaker:
    instances:
      carrierApi:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.lang.Exception
        ignoreExceptions:
          - java.lang.IllegalArgumentException

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
