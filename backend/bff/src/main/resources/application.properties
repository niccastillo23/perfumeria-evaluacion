server.port=8080
spring.application.name=perfumeria-bff

# Security is disabled only for local scaffolding until Entra IDs are available.
app.security.enabled=${SECURITY_ENABLED:false}
app.security.audience=${AZURE_API_AUDIENCE:}

# Frontend origin allowed to call the BFF.
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# Internal microservice URLs.
app.services.catalog-url=${CATALOG_SERVICE_URL:http://localhost:8081/api/catalog}
app.services.orders-url=${ORDERS_SERVICE_URL:http://localhost:8082/api/orders}
app.services.profile-url=${PROFILE_SERVICE_URL:http://localhost:8084/api/profile}
app.services.admin-url=${ADMIN_SERVICE_URL:http://localhost:8085/api/admin}

# Microsoft Graph registration (client credentials). Never expose the secret to the frontend.
app.registration.tenant-id=${AZURE_TENANT_ID:}
app.registration.client-id=${AZURE_CLIENT_ID:}
app.registration.client-secret=${AZURE_CLIENT_SECRET:}
