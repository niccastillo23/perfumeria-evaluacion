server:
  port: ${SERVER_PORT:8087}
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: rabbit-admin-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:perfumeria}
    password: ${RABBITMQ_PASSWORD:change-me-local}
    connection-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
